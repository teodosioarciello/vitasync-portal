services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vitasync
      POSTGRES_USER: vitasync
      POSTGRES_PASSWORD: vitasync_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Sprint OCR - VLM locale per OCR intelligente (solo CPU, ok su Raspberry Pi 5).
  # Avvio: docker compose --profile ollama up -d
  # Primo utilizzo: docker exec -it vitasync-ollama ollama pull qwen2.5vl:3b
  ollama:
    image: ollama/ollama:latest
    container_name: vitasync-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Su RPi5 (ARM64) l'immagine ollama/ollama include il runtime CPU;
      # limitare la RAM se serve: deploy.resources o OLLAMA_NUM_PARALLEL=1
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev

volumes:
  pgdata:
  frontend_node_modules:
  ollama_data: